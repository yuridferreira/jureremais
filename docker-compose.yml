services:
  postgres:
    image: postgres:16-alpine
    container_name: jureremais-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jureremais
      POSTGRES_PASSWORD: jureremais
      POSTGRES_DB: jureremais
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jureremais -d jureremais"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jureremais-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
